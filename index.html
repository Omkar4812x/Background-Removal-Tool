<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #000;
        }

        .calculator {
            background: #111;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.2);
            width: 320px;
        }

        .display {
            background: #222;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: right;
            color: #fff;
        }

        #equation {
            font-size: 18px;
            color: #ff1493;
            min-height: 24px;
            margin-bottom: 8px;
            opacity: 0.7;
        }

        #current {
            font-size: 36px;
            font-weight: bold;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            border: none;
            padding: 20px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #fff;
            color: #000;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 20, 147, 0.3);
        }

        .operator {
            background: #ff1493;
            color: white;
        }

        .special {
            background: #333;
            color: white;
        }

        .equals {
            background: #000;
            color: white;
        }

        .memory-btn {
            grid-column: span 2;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div id="equation"></div>
            <div id="current">0</div>
        </div>
        <div class="buttons">
            <button class="special" onclick="clearAll()">AC</button>
            <button class="special" onclick="toggleSign()">±</button>
            <button class="special" onclick="percent()">%</button>
            <button class="operator" onclick="setOperation('/')">÷</button>
            
            <button class="memory-btn special" onclick="memoryAdd()">M+</button>
            <button class="memory-btn special" onclick="memorySubtract()">M-</button>
            
            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="setOperation('*')">×</button>
            
            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="setOperation('-')">-</button>
            
            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="setOperation('+')">+</button>
            
            <button onclick="appendNumber('0')">0</button>
            <button onclick="appendNumber('.')">.</button>
            <button class="operator" onclick="sqrt()">√</button>
            <button class="operator equals" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        let current = '0';
        let equation = '';
        let previous = null;
        let operation = null;
        let memory = 0;

        function updateDisplay() {
            document.getElementById('current').textContent = current;
            document.getElementById('equation').textContent = equation;
        }

        function appendNumber(num) {
            if (current === '0' && num !== '.') {
                current = num;
            } else {
                current += num;
            }
            updateDisplay();
        }

        function setOperation(op) {
            if (operation !== null) calculate();
            previous = current;
            operation = op;
            equation = previous + ' ' + op;
            current = '0';
            updateDisplay();
        }

        function calculate() {
            let result;
            const prev = parseFloat(previous);
            const curr = parseFloat(current);
            
            switch(operation) {
                case '+': result = prev + curr; break;
                case '-': result = prev - curr; break;
                case '*': result = prev * curr; break;
                case '/': result = prev / curr; break;
            }
            
            equation = '';
            operation = null;
            previous = null;
            current = result.toString();
            updateDisplay();
        }

        function clearAll() {
            current = '0';
            equation = '';
            previous = null;
            operation = null;
            updateDisplay();
        }

        function toggleSign() {
            current = (parseFloat(current) * -1).toString();
            updateDisplay();
        }

        function percent() {
            current = (parseFloat(current) / 100).toString();
            updateDisplay();
        }

        function sqrt() {
            current = Math.sqrt(parseFloat(current)).toString();
            updateDisplay();
        }

        function memoryAdd() {
            memory += parseFloat(current);
        }

        function memorySubtract() {
            memory -= parseFloat(current);
        }

        // Initialize display
        updateDisplay();
    </script>
</body>
</html>
