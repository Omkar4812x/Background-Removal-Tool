<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Background Remover</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 90%;
            max-width: 800px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #23a6d5, transparent);
            animation: loading 2s linear infinite;
        }

        @keyframes loading {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .container:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .upload-section {
            border: 3px dashed #23a6d5;
            border-radius: 15px;
            padding: 2.5rem;
            text-align: center;
            margin-bottom: 2rem;
            transition: all 0.4s ease;
            position: relative;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        .upload-section.drag-over {
            background: rgba(35, 166, 213, 0.1);
            transform: scale(1.02);
            border-color: #23d5ab;
        }

        h1 {
            color: #2d3748;
            margin-bottom: 1.5rem;
            font-size: 2.5rem;
            text-align: center;
            position: relative;
            padding-bottom: 15px;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: linear-gradient(90deg, #23a6d5, #23d5ab);
        }

        .file-input {
            display: none;
        }

        .upload-label {
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 30px;
            background: linear-gradient(45deg, #23a6d5, #23d5ab);
            color: white;
            border-radius: 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .upload-label:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(35, 166, 213, 0.4);
        }

        .upload-label i {
            font-size: 1.2rem;
        }

        .preview-area {
            margin-top: 2rem;
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .image-preview {
            max-width: 100%;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
        }

        .image-preview:hover {
            transform: scale(1.02);
        }

        .result-section {
            display: none;
            margin-top: 2rem;
            text-align: center;
            animation: fadeIn 0.5s ease-out;
        }

        .download-btn {
            background: linear-gradient(45deg, #23d5ab, #23a6d5);
            color: white;
            padding: 15px 35px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .download-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(35, 166, 213, 0.4);
        }

        .loading-spinner {
            display: none;
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #23a6d5;
            border-radius: 50%;
            margin: 20px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .upload-icon {
            font-size: 3rem;
            color: #23a6d5;
            margin-bottom: 1rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        .status-message {
            margin-top: 1rem;
            color: #666;
            font-size: 1.1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status-message.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Professional Background Remover</h1>
        
        <div class="upload-section" id="uploadSection">
            <i class="fas fa-cloud-upload-alt upload-icon"></i>
            <input type="file" id="fileInput" class="file-input" accept="image/*">
            <label for="fileInput" class="upload-label">
                <i class="fas fa-image"></i>
                Choose Image or Drop Here
            </label>
            <p class="status-message" id="statusMessage">Supported formats: JPG, PNG</p>
        </div>

        <div class="loading-spinner" id="loadingSpinner"></div>

        <div class="preview-area" id="previewArea">
            <img id="imagePreview" class="image-preview" alt="Preview">
        </div>

        <div class="result-section" id="resultSection">
            <a href="#" class="download-btn" id="downloadBtn">
                <i class="fas fa-download"></i>
                Download Image
            </a>
        </div>
    </div>

    <script>
        const uploadSection = document.getElementById('uploadSection');
        const fileInput = document.getElementById('fileInput');
        const previewArea = document.getElementById('previewArea');
        const imagePreview = document.getElementById('imagePreview');
        const resultSection = document.getElementById('resultSection');
        const downloadBtn = document.getElementById('downloadBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const statusMessage = document.getElementById('statusMessage');

        // Drag and drop handling
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            uploadSection.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            uploadSection.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            uploadSection.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            uploadSection.classList.add('drag-over');
        }

        function unhighlight(e) {
            uploadSection.classList.remove('drag-over');
        }

        uploadSection.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const file = dt.files[0];
            handleImageUpload(file);
        }

        fileInput.addEventListener('change', function(e) {
            handleImageUpload(e.target.files[0]);
        });

        function handleImageUpload(file) {
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    imagePreview.src = e.target.result;
                    previewArea.style.display = 'block';
                    showStatusMessage('Processing image...', true);
                    removeBackground(file);
                }
                
                reader.readAsDataURL(file);
            } else {
                showStatusMessage('Please select a valid image file.', false);
            }
        }

        function showStatusMessage(message, isProcessing) {
            statusMessage.textContent = message;
            statusMessage.classList.add('show');
            if (isProcessing) {
                loadingSpinner.style.display = 'block';
            } else {
                loadingSpinner.style.display = 'none';
            }
            setTimeout(() => {
                statusMessage.classList.remove('show');
            }, 3000);
        }

        async function removeBackground(file) {
            try {
                loadingSpinner.style.display = 'block';
                showStatusMessage('Removing background...', true);

                const formData = new FormData();
                formData.append('image_file', file);
                formData.append('size', 'auto');

                const response = await fetch('https://api.remove.bg/v1.0/removebg', {
                    method: 'POST',
                    headers: {
                        'X-Api-Key': 'Mh5EG9SUBwo7Tw4LXvgbLuoa' // Replace with your Remove.bg API key
                    },
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const blob = await response.blob();
                const resultUrl = URL.createObjectURL(blob);
                
                downloadBtn.href = resultUrl;
                resultSection.style.display = 'block';
                loadingSpinner.style.display = 'none';
                showStatusMessage('Background removed successfully!', false);
                
            } catch (error) {
                console.error('Error:', error);
                showStatusMessage('Error removing background. Please try again.', false);
                loadingSpinner.style.display = 'none';
            }
        }

        // Download handling
        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.href = downloadBtn.href;
            link.download = 'removed-background.png';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
